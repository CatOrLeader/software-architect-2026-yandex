name: PlantUML Diagrams

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate Diagrams
      run: |
        docker run --rm \
          --env PLANTUML_SECURITY_PROFILE=UNSECURE \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace \
          plantuml/plantuml:1.2026.4@sha256:e0f6fb9cb28defdbcd63320c61d0e98f6cf3302039f881278db8a9cb74c6fed2 \
          -tpng \
          diagrams/context/*.puml \
          diagrams/container/*.puml \
          diagrams/component/*.puml \
          diagrams/code/*.puml \
          diagrams/er/*.puml

    - name: Commit Diagrams
      if: github.event_name == 'push'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add diagrams/**/*.png
        if ! git diff --cached --quiet; then
          git commit -m "Automated diagram generation"
          git push origin main
        fi
