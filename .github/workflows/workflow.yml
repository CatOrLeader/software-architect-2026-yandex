name: PlantUML Diagrams

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Graphviz
      run: sudo apt-get update && sudo apt-get install --yes graphviz

    - name: Download PlantUML 1.2026.4
      run: |
        curl --fail --location --silent --show-error \
          --output plantuml.jar \
          https://github.com/plantuml/plantuml/releases/download/v1.2026.4/plantuml-1.2026.4.jar
        java -jar plantuml.jar -version

    - name: Generate Diagrams
      env:
        PLANTUML_SECURITY_PROFILE: UNSECURE
      run: find diagrams -name '*.puml' -type f -not -empty -print0 | xargs -0 java -jar plantuml.jar -tpng

    - name: Commit Diagrams
      if: github.event_name == 'push'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add diagrams/**/*.png
        if ! git diff --cached --quiet; then
          git commit -m "Automated diagram generation"
          git push origin main
        fi
